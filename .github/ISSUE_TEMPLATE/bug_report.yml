name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste the e-mail nor the password of your AldesConnect account.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.3.0'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Aldes, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Aldes product
      description: The product (InspirAIR, EasyHOME, Dee Fly Cube, T.One AIR or AquaAIR) and its reference as "Test the connection" shows it.
      placeholder: 'InspirAIR Home S, T.One AquaAIR with 3 room thermostats'
  - type: textarea
    id: test-connection
    attributes:
      label: Result of "Test the connection"
      description: The text shown under the "Test the connection" button of the configuration (products, modes, features). Rename your products if you wish.
      render: text
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Remember that a change made in Gladys goes through the Aldes cloud, and a change made in the AldesConnect app reaches Gladys at the next reading.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. The logs never contain the password nor the access token.
      render: text
